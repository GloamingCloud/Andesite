[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
conquer-once = { version = "0.4.0", default-features = false }
lazy_static = {version = "1.5.0", features = ["spin_no_std"]}
log = "0.4.32"
spinning_top = "0.3.0"
uart_16550 = "0.6.0"
uefi = { version = "0.36.1" }
x86_64 = "0.15.4"

[dependencies.noto-sans-mono-bitmap]
version = "0.3.2"
default-features = false
features = [
    "regular",
    "size_16",
    "unicode-basic-latin",
    "unicode-specials",
]
